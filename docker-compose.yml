services:
  backend:
    build:
      context: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_NAME: "ML Prediction Service"
      APP_ENV: local
      APP_DEBUG: "false"
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://ml_user:change-me@postgres:5432/ml_prediction_service
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me-to-a-long-random-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      MODEL_STORAGE_PATH: /var/lib/ml_prediction_service/models
      MAX_MODEL_UPLOAD_SIZE_BYTES: "10485760"
      PREDICTION_PRICE_CREDITS: "1"
      CELERY_TASK_QUEUE: ${CELERY_TASK_QUEUE:-celery}
      BOOTSTRAP_LOCAL_ADMIN: "true"
      LOCAL_ADMIN_USERNAME: admin
      LOCAL_ADMIN_EMAIL: admin@example.com
      LOCAL_ADMIN_PASSWORD: admin
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    volumes:
      - model_storage:/var/lib/ml_prediction_service/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      APP_NAME: "ML Prediction Service"
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://ml_user:change-me@postgres:5432/ml_prediction_service
      REDIS_URL: redis://redis:6379/0
      MODEL_STORAGE_PATH: /var/lib/ml_prediction_service/models
      MAX_MODEL_UPLOAD_SIZE_BYTES: "10485760"
      PREDICTION_PRICE_CREDITS: "1"
      CELERY_TASK_QUEUE: ${CELERY_TASK_QUEUE:-celery}
    volumes:
      - model_storage:/var/lib/ml_prediction_service/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
    command:
      streamlit run src/app/dashboard/main.py --server.address=0.0.0.0 --server.port=8501
    environment:
      APP_NAME: "ML Prediction Service"
      APP_ENV: local
      API_BASE_URL: http://backend:8000/api/v1
    ports:
      - "${DASHBOARD_PORT:-18501}:8501"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ml_user
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: ml_prediction_service
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml_user -d ml_prediction_service"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  grafana_data:
  prometheus_data:
  postgres_data:
  model_storage:
